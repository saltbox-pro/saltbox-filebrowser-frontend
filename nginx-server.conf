server {
  listen 80;
  root /srv/saltbox-filebrowser-frontend/;

  location ~* "\.[0-9a-f]{8,}\.(js|mjs|css|map|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /index.js.map {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
